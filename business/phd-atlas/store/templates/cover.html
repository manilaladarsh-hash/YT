<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #0f2f47 0%, #1f5f8b 60%, #2b7bb0 100%); color: #fff; position: relative; }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 40px 40px; }
.wrap { position: relative; padding: {{PAD}}px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
.tag { display: inline-block; background: #f0b429; color: #1d232b; font-weight: 700; padding: 6px 14px; border-radius: 999px; font-size: {{TAG}}px; letter-spacing: .02em; }
h1 { font-size: {{H1}}px; line-height: 1.02; margin-top: 18px; letter-spacing: -0.02em; }
.sub { font-size: {{SUB}}px; opacity: .92; margin-top: 14px; max-width: 900px; line-height: 1.3; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); padding: 8px 14px; border-radius: 10px; font-size: {{CHIP}}px; }
.foot { font-size: {{FOOT}}px; opacity: .85; margin-top: 14px; }
</style></head>
<body><div class="grid"></div><div class="wrap">
<div><span class="tag">{{TAGTEXT}}</span><h1>{{TITLE}}</h1><p class="sub">{{SUBTEXT}}</p></div>
<div><div class="chips">{{CHIPS}}</div><p class="foot">{{FOOTTEXT}}</p></div>
</div></body></html>
