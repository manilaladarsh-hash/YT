<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #fbfaf7; --ink: #1b2129; --muted: #5a6472; --line: #e1e2e6; --line-2: #eceae4;
  --accent: #1d5c8a; --accent-2: #e8f0f7; --accent-ink: #ffffff;
  --good: #1c6b3b; --good-bg: #e2f2e7; --warn: #855700; --warn-bg: #fbefd6; --bad: #a12a2a; --bad-bg: #f9e1e0;
  --na: #5a6472; --na-bg: #eef0f2; --focus: #e8a317; --star: #d18f00;
  --g-phys: #2a5fa8; --g-math: #6b3fa0; --g-comp: #0f7a73; --g-life: #2e7d32; --g-earth: #8a5a14; --g-eng: #b3471f;
  --shadow: 0 1px 2px rgba(20,30,40,.06), 0 2px 8px rgba(20,30,40,.05);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --panel: #192028; --panel-2: #1d252e; --ink: #e7ebf0; --muted: #9ba6b4; --line: #2b3540; --line-2: #26303a;
    --accent: #77b6e4; --accent-2: #1f2f3d; --accent-ink: #0c1117;
    --good: #8fd6a4; --good-bg: #1b3324; --warn: #f0c46a; --warn-bg: #3a2e15; --bad: #f2a0a0; --bad-bg: #3d2020;
    --na: #9ba6b4; --na-bg: #242d37; --star: #f2c14e;
    --g-phys: #7fa9e8; --g-math: #b597e0; --g-comp: #5cc8bf; --g-life: #86c98a; --g-earth: #d8ac66; --g-eng: #ee9a77;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --panel: #192028; --panel-2: #1d252e; --ink: #e7ebf0; --muted: #9ba6b4; --line: #2b3540; --line-2: #26303a;
  --accent: #77b6e4; --accent-2: #1f2f3d; --accent-ink: #0c1117;
  --good: #8fd6a4; --good-bg: #1b3324; --warn: #f0c46a; --warn-bg: #3a2e15; --bad: #f2a0a0; --bad-bg: #3d2020;
  --na: #9ba6b4; --na-bg: #242d37; --star: #f2c14e;
  --g-phys: #7fa9e8; --g-math: #b597e0; --g-comp: #5cc8bf; --g-life: #86c98a; --g-earth: #d8ac66; --g-eng: #ee9a77;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 6px 8px; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
.brand b { font-size: 1.12rem; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.tabs button { border: none; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.count-pill { display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .75rem; line-height: 1.5em; text-align: center; }

.wrap { max-width: 1400px; margin: 0 auto; padding: 16px; }
.layout { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

/* situation */
.situation { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; }
.situation > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
.situation > summary::-webkit-details-marker { display: none; }
.situation > summary small { font-weight: 500; color: var(--muted); }
.sit-body { padding: 0 16px 16px; }
.show-results { display: none; }
.q { margin: 0 0 14px; border: 0; padding: 0; min-width: 0; }
.q legend, .q .qlabel { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; padding: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border-radius: 999px; padding: 5px 11px; font-size: .86rem; background: var(--panel-2); }
.opt[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt .n { opacity: .7; font-size: .78em; margin-left: 3px; }
.grp { font-size: .74rem; color: var(--muted); margin: 8px 0 4px; width: 100%; }
.scores { display: flex; gap: 8px; margin-top: 8px; }
.scores label { display: flex; flex-direction: column; font-size: .78rem; color: var(--muted); gap: 3px; flex: 1; }
.scores input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.sit-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line-2); padding-top: 12px; }
.hint { font-size: .8rem; color: var(--muted); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar input[type="search"] { flex: 1 1 240px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
.toolbar select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 8px 12px; background: var(--panel); }
.seg button[aria-pressed="true"] { background: var(--accent-2); color: var(--accent); font-weight: 600; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.summary { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 2px 0 12px; font-size: .9rem; color: var(--muted); }
.summary b { color: var(--ink); }
.dot { display: inline-block; width: .65em; height: .65em; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; padding: 14px 14px 12px; gap: 8px; position: relative; border-left: 4px solid var(--line); }
.card.fit-match { border-left-color: var(--good); } .card.fit-check { border-left-color: var(--warn); } .card.fit-obstacle { border-left-color: var(--bad); }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.ftag { font-size: .74rem; font-weight: 700; letter-spacing: .02em; color: var(--gc, var(--accent)); text-transform: uppercase; }
.ftag .also { font-weight: 500; text-transform: none; color: var(--muted); letter-spacing: 0; }
.card h3 { margin: 1px 0 0; font-size: 1.05rem; line-height: 1.3; }
.meta { color: var(--muted); font-size: .83rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.star { font-size: 1.25rem; line-height: 1; padding: 4px 8px; border-radius: 8px; background: transparent; }
.star[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 6px; }
.fact { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 6px 8px; min-width: 0; text-align: left; }
.fact small { display: block; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
.fact span { display: block; font-weight: 600; font-size: .86rem; line-height: 1.3; overflow-wrap: break-word; }
.fact em { display: block; font-style: normal; font-size: .72rem; line-height: 1.3; color: var(--muted); margin-top: 1px; }
.fact em.soon { color: var(--bad); font-weight: 600; }
.fact.t-good span { color: var(--good); } .fact.t-bad span { color: var(--bad); } .fact.t-warn span { color: var(--warn); }
.fitline { font-size: .84rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.fitline.match { color: var(--good); } .fitline.check { color: var(--warn); } .fitline.obstacle { color: var(--bad); }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: .84rem; }
.reasons li { display: flex; gap: 6px; align-items: baseline; }
.reasons li::before { flex: none; width: 1.1em; text-align: center; font-weight: 700; }
.reasons li.bad::before { content: "✕"; color: var(--bad); }
.reasons li.warn::before { content: "!"; color: var(--warn); }
.reasons li.good::before { content: "✓"; color: var(--good); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.b { display: inline-block; border-radius: 6px; padding: 1px 7px; font-size: .78rem; border: 1px solid transparent; }
.b-good { background: var(--good-bg); color: var(--good); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); } .b-info { background: var(--na-bg); color: var(--ink); }
.b-na { color: var(--muted); border: 1px dashed var(--line); }
.unstated { font-size: .78rem; color: var(--muted); }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; gap: 8px; }
.card-foot a { font-size: .84rem; }
.more { display: flex; justify-content: center; margin: 16px 0; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }

/* table view */
.tablewrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 1200px; font-size: .86rem; }
table.grid th, table.grid td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
table.grid th { position: sticky; top: 0; background: var(--panel); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); z-index: 1; }
table.grid td.prog { min-width: 210px; }
table.grid td.prog b { display: block; }
table.grid td.prog span { color: var(--muted); font-size: .8rem; }
.cellbtn { border: 1px solid transparent; background: none; padding: 1px 6px; border-radius: 6px; text-align: left; font-size: .82rem; }
.cellbtn:hover { border-color: var(--muted); }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); color: var(--ink); width: min(760px, calc(100% - 24px)); max-height: calc(100vh - 32px); padding: 0; }
dialog::backdrop { background: rgba(8, 12, 16, .5); }
.d-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.d-head h2 { margin: 2px 0 2px; font-size: 1.2rem; }
.d-head .meta { -webkit-line-clamp: 3; }
.d-close { position: absolute; right: 12px; top: 12px; }
.d-body { padding: 8px 20px 20px; }
.d-sec { font-size: .76rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
.row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.row:last-child { border-bottom: none; }
.row .k { color: var(--muted); font-size: .86rem; }
.row .lvl { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
.row p { margin: 4px 0 0; font-size: .92rem; }
.row blockquote { margin: 6px 0 0; padding: 6px 10px; border-left: 3px solid var(--accent); background: var(--panel-2); font-size: .86rem; border-radius: 0 8px 8px 0; }
.row .src { font-size: .8rem; }
.row .flag { color: var(--warn); font-size: .78rem; display: block; margin-top: 3px; }
.note-box { background: var(--accent-2); border-radius: 10px; padding: 10px 12px; font-size: .88rem; margin-top: 12px; }

/* plan */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { padding: 14px 16px; }
.stat small { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.stat b { display: block; font-size: 1.5rem; letter-spacing: -.01em; margin-top: 2px; }
.stat span { color: var(--muted); font-size: .82rem; }
.plan-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.timeline { padding: 6px 16px 10px; margin-bottom: 16px; }
.tl-month { font-weight: 700; margin: 12px 0 4px; font-size: .9rem; }
.tl-item { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: .9rem; align-items: baseline; }
.tl-item:last-child { border-bottom: none; }
.tl-item .when { font-weight: 600; }
.tl-item .left { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.tl-item .left.soon { color: var(--bad); font-weight: 600; }
.tl-item.past { opacity: .6; }
.todo { padding: 14px 16px; margin-bottom: 12px; }
.todo h3 { margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.todo h3 small { color: var(--muted); font-weight: 500; font-size: .82rem; white-space: nowrap; }
.todo ul { list-style: none; padding: 0; margin: 8px 0 0; }
.todo li { padding: 4px 0; }
.todo label { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; font-size: .9rem; }
.todo input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--accent); flex: none; }
.todo li.done label { color: var(--muted); text-decoration: line-through; }
.progress { height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--good); }

/* guide */
.guide { padding: 18px 22px; max-width: 860px; }
.guide h2 { font-size: 1.15rem; margin: 18px 0 6px; }
.guide h2:first-child { margin-top: 0; }
.guide li { margin: 4px 0; }
footer { max-width: 1400px; margin: 0 auto; padding: 6px 16px 34px; color: var(--muted); font-size: .82rem; }
.loading { padding: 60px 20px; text-align: center; color: var(--muted); }

@media (max-width: 920px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .situation { position: static; max-height: none; }
  .show-results { display: inline-flex; }
  .tabs button { padding: 6px 10px; }
  .seg.views { display: none; }
}
@media (max-width: 560px) {
  .wrap { padding: 12px; }
  .top-in { padding: 8px 12px; gap: 8px; }
  .brand span { display: none; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .tl-item { grid-template-columns: 78px minmax(0, 1fr); }
  .plan-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .stat { padding: 12px 14px; }
  .stat b { font-size: 1.25rem; }
  .plan-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .plan-actions button:last-child { grid-column: 1 / -1; }
  .tl-item .left { grid-column: 2; }
  .d-head, .d-body { padding-left: 14px; padding-right: 14px; }
}
@media print {
  .top, .situation, .toolbar, .quick, .plan-actions, .star, .more, footer button { display: none !important; }
  body { background: #fff; }
  .panel { box-shadow: none; }
  .layout { display: block; }
  [hidden] { display: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>__TITLE__</b><span id="tagline">Loading…</span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-find" aria-selected="true" aria-controls="view-find">Find programs</button>
      <button role="tab" id="tab-plan" aria-selected="false" aria-controls="view-plan">My plan<span class="count-pill" id="starCount">0</span></button>
      <button role="tab" id="tab-guide" aria-selected="false" aria-controls="view-guide">How to read</button>
    </nav>
    <button id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="loading">Opening the Atlas…</div>

  <section id="view-find" role="tabpanel" aria-labelledby="tab-find" hidden>
    <div class="layout">
      <details class="panel situation" id="situation" open>
        <summary><span>Your situation</span><small id="sitCount"></small></summary>
        <div class="sit-body" id="sitBody"></div>
      </details>
      <div>
        <div class="toolbar">
          <label class="sr" for="q">Search programs</label>
          <input id="q" type="search" placeholder="Search university, city, department, topic…" autocomplete="off">
          <label class="sr" for="sort">Sort</label>
          <select id="sort">
            <option value="fit">Best fit first</option>
            <option value="deadline">Deadline (soonest)</option>
            <option value="fee">Application fee (lowest)</option>
            <option value="name">Name (A–Z)</option>
          </select>
          <div class="seg views" role="group" aria-label="View">
            <button type="button" id="vCards" aria-pressed="true">Cards</button>
            <button type="button" id="vTable" aria-pressed="false">Table</button>
          </div>
        </div>
        <div class="quick" role="group" aria-label="Quick filters">
          <button class="opt" type="button" data-quick="nofee" aria-pressed="false">No fee or waiver route</button>
          <button class="opt" type="button" data-quick="soon" aria-pressed="false">Closing in 6 weeks</button>
          <button class="opt" type="button" data-quick="funded" aria-pressed="false">Guaranteed funding</button>
          <button class="opt" type="button" data-quick="hideobs" aria-pressed="false">Hide obstacles</button>
          <button class="opt" type="button" data-quick="starred" aria-pressed="false">★ In my plan</button>
        </div>
        <div class="summary" id="summary" aria-live="polite"></div>
        <div id="results"></div>
        <div class="more"><button type="button" id="moreBtn" hidden>Show more</button></div>
      </div>
    </div>
  </section>

  <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>

  <section id="view-guide" role="tabpanel" aria-labelledby="tab-guide" hidden>
    <div class="panel guide" id="guideBody"></div>
  </section>
</div>

<dialog id="detail" aria-labelledby="dTitle">
  <div class="d-head">
    <div class="ftag" id="dTag"></div>
    <h2 id="dTitle"></h2>
    <div class="meta" id="dMeta"></div>
    <button class="d-close ghost" type="button" id="dClose" aria-label="Close">✕</button>
  </div>
  <div class="d-body" id="dBody"></div>
</dialog>

<footer><p id="foot"></p><p>Not affiliated with any university. Confirm on the official page before you pay or submit. Not immigration, visa or legal advice.</p></footer>

<script>
"use strict";
const PACKED = "__ATLAS_GZ__";
const DAY = 86400000;
const PAGE = 48;
const FIELDS = [
  ["deadline", "Deadline"], ["app_fee", "Application fee"], ["fee_waiver", "Fee waiver (internationals)"],
  ["gre_general", "GRE General"], ["gre_subject", "GRE Subject test"], ["toefl_min", "TOEFL minimum"],
  ["ielts_min", "IELTS minimum"], ["english_waiver", "English-test waiver (English-medium Indian degree)"],
  ["supervisor", "Supervisor before admission"], ["funding", "Funding"], ["entry_route", "Entry route"]
];
const SECTIONS = [["Dates and money", ["deadline", "app_fee", "fee_waiver", "funding"]],
  ["Tests", ["gre_general", "gre_subject", "toefl_min", "ielts_min", "english_waiver"]],
  ["Admission", ["entry_route", "supervisor"]]];
const TONE = {
  fee_waiver: { "Available": "good", "No fee": "good", "Limited": "warn", "Domestic only": "bad", "None": "bad" },
  gre_general: { "Required": "bad", "Recommended": "warn", "Optional": "good", "Not required": "good", "Not considered": "good" },
  gre_subject: { "Required": "bad", "Recommended": "warn", "Optional": "good", "Not required": "good", "Not considered": "good" },
  english_waiver: { "Yes": "good", "Conditional": "warn", "No": "bad", "Check tool": "warn" },
  supervisor: { "Required": "warn", "Recommended": "warn", "Not required": "good" },
  funding: { "Guaranteed": "good", "Typical": "good", "Competitive": "warn" },
  entry_route: { "Direct from bachelor's": "good", "Either": "good", "Master's usually required": "warn" }
};
const GROUP_COLOR = { "Physical sciences": "--g-phys", "Mathematical sciences": "--g-math", "Computing": "--g-comp",
  "Life sciences": "--g-life", "Earth & environment": "--g-earth", "Engineering": "--g-eng" };

/* ---------- dates, money ---------- */

/* ---------- data ---------- */
async function decode(b64) {

}

}

      else if (u.f[k]) { f[k] = unpack(u.f[k]); lvl[k] = "university"; }

    return {
      id: p.i, uni: p.u, u, field: p.f, fieldsAll, fname: t.name, group: t.group, also: (p.a || []).map(x => tax[x].name),
      label, title: u.s, pname: p.n, dept: p.d, page: A.urls[p.p],
      checked: p.k, f, lvl, notes: [p.o, u.o].filter(Boolean).join(" "), inr: p.inr, usd: p.usd,

/* ---------- fit engine ---------- */
const NA_SET = new Set(["US", "Canada"]);
function feeIsZero(p) { return p.f.app_fee.code.startsWith("0"); }
function fit(p) {
  const r = [], pr = profile, f = p.f;

  if (isDate(dl) && daysLeft(dl) < 0) add("bad", "This cycle's deadline (" + fmtDate(dl) + ") has passed");
  if (pr.degree === "bachelor") {
    const e = c("entry_route");
    if (e === "Master's usually required") add("bad", "Usually needs a master's first");
    else if (e === "Not stated") add("warn", "Entry with a bachelor's not stated");
    else add("good", e === "Either" ? "Bachelor's or master's holders can apply" : "Direct entry from a bachelor's");
  }

    const s = c("gre_subject");

    else if (s === "Not stated") { if (na && p.fieldsAll.some(x => ["physics", "chemistry", "math", "statistics", "astronomy"].includes(x))) add("warn", "GRE Subject policy not stated"); }
    else add("good", "No GRE Subject test needed");
  }
  if (pr.ggre === "no") {
    const g = c("gre_general");
    if (g === "Required") add("bad", "GRE General required");
    else if (g === "Recommended") add("warn", "GRE General recommended");
    else if (g === "Not stated") { if (na) add("warn", "GRE General policy not stated"); }
    else add("good", "No GRE General needed");
  }
  if (pr.english === "avoid") {
    const e = c("english_waiver");
    if (e === "No") add("bad", "English test needed (Indian degrees not exempt)");
    else if (e === "Conditional" || e === "Check tool") add("warn", "English-test waiver has conditions");
    else if (e === "Not stated") add("warn", "English-test waiver not stated");

    const i = parseFloat(pr.ielts), im = parseFloat(c("ielts_min"));

    if (i && !isNaN(im) && i < im) add("bad", "Your IELTS " + i + " is below the minimum " + im);
    else if (i && !isNaN(im)) add("good", "IELTS minimum " + im + " met");
  }
  if (pr.fees === "free") {
    const w = c("fee_waiver");
    if (feeIsZero(p) || w === "No fee") add("good", "No application fee");
    else if (w === "Available") add("good", "Fee waiver open to internationals");
    else if (w === "Limited") add("warn", "Fee waiver only in limited cases");
    else if (w === "Domestic only" || w === "None") add("bad", (p.inr ? inr(p.inr) + " fee" : "Fee") + ", no waiver for internationals");
    else add("warn", c("app_fee") === "Not stated" ? "Application fee not stated" : "Fee waiver not stated");
  }
  if (pr.funding === "need") {
    const u = c("funding");
    if (u === "Guaranteed") add("good", "Funding guaranteed for admitted students");
    else if (u === "Typical") add("warn", "Most, but not all, students are funded");
    else if (u === "Competitive") add("warn", "Funding is competitive");
    else add("warn", "Funding not stated");
  }
  if (pr.supervisor === "avoid") {
    const s = c("supervisor");
    if (s === "Required") add("bad", "Needs a supervisor's agreement before admission");
    else if (s === "Not required") add("good", "No supervisor needed before admission");
  }
  const bad = r.filter(x => x.tone === "bad").length, warn = r.filter(x => x.tone === "warn").length;

}

/* ---------- filtering + sorting ---------- */
function visible() {
  const q = $("q").value.trim().toLowerCase();
  const plus42 = new Date(Date.now() + 42 * DAY).toISOString().slice(0, 10);
  const out = [];
  for (const p of P) {
    if (profile.fields.length && !p.fieldsAll.some(x => profile.fields.includes(x))) continue;
    if (profile.regions.length && !profile.regions.includes(p.region)) continue;
    if (q && !q.split(/\s+/).every(w => p.hay.includes(w))) continue;
    if (quick.has("starred") && !stars.has(p.id)) continue;
    if (quick.has("nofee") && !(feeIsZero(p) || ["Available", "Limited", "No fee"].includes(p.f.fee_waiver.code))) continue;
    if (quick.has("funded") && p.f.funding.code !== "Guaranteed") continue;
    const dl = p.f.deadline.code;
    if (quick.has("soon") && !(isDate(dl) && dl >= todayIso() && dl <= plus42)) continue;
    const ft = fit(p);
    if (quick.has("hideobs") && ft.status === "obstacle") continue;
    out.push([p, ft]);
  }
  const s = $("sort").value;
  const rank = { match: 0, check: 1, none: 1, obstacle: 2 };
  const dkey = p => { const d = p.f.deadline.code; return isDate(d) ? (d < todayIso() ? "8" + d : d) : "9" + d; };
  const fee = p => p.inr === null || p.inr === undefined ? Infinity : p.inr;
  out.sort(([a, fa], [b, fb]) => {
    if (s === "fit") return rank[fa.status] - rank[fb.status] || fa.warn - fb.warn || dkey(a).localeCompare(dkey(b)) || a.label.localeCompare(b.label);
    if (s === "deadline") return dkey(a).localeCompare(dkey(b)) || a.label.localeCompare(b.label);
    if (s === "fee") return fee(a) - fee(b) || a.label.localeCompare(b.label);
    return a.label.localeCompare(b.label);
  });
  return out;
}

}
function shortCode(k, f) {

}

/* ---------- detail ---------- */

/* ---------- plan ---------- */
function tasks(p) {
  const f = p.f, out = [];
  const dl = f.deadline;
  const fee = f.app_fee.code, w = f.fee_waiver.code;
  if (f.supervisor.code === "Required") out.push(["sup", "Get a potential supervisor's agreement before you apply"]);
  else if (f.supervisor.code === "Recommended") out.push(["sup", "Email 2–3 potential supervisors (see Playbook)"]);
  if (!fee.startsWith("0") && (w === "Available" || w === "Limited")) out.push(["waiver", "Request the application-fee waiver" + (f.fee_waiver.time_sensitive ? " by " + fmtDate(f.fee_waiver.time_sensitive) : " before you pay")]);
  if (f.gre_subject.code === "Required" || f.gre_subject.code === "Recommended") out.push(["sgre", "Take the GRE Subject test and send scores (" + f.gre_subject.code.toLowerCase() + ")"]);
  if (f.gre_general.code === "Required" || f.gre_general.code === "Recommended") out.push(["ggre", "Send GRE General scores (" + f.gre_general.code.toLowerCase() + ")"]);
  const e = f.english_waiver.code;
  if (f.toefl_min.code === "Not required" && f.ielts_min.code !== "Not required" && f.ielts_min.code !== "Not stated") out.push(["eng", "Send IELTS scores (minimum " + f.ielts_min.code + ")"]);
  else if (f.toefl_min.code === "Not required") { /* no English certificate needed */ }
  else if (e === "Yes" || e === "Conditional") out.push(["eng", "Get an English-medium (MOI) certificate from your university" + (e === "Conditional" ? " and check the conditions" : "")]);
  else {
    const mins = [f.toefl_min.code !== "Not stated" ? "TOEFL " + f.toefl_min.code : "", f.ielts_min.code !== "Not stated" ? "IELTS " + f.ielts_min.code : ""].filter(Boolean).join(" / ");
    out.push(["eng", "Send English-test scores" + (mins ? " (minimum " + mins + ")" : "")]);
  }
  out.push(["letters", "Confirm 3 recommenders and send them the deadline"]);
  out.push(["sop", "Tailor your statement of purpose to this program"]);
  if (fee !== "Not stated" && !fee.startsWith("0")) out.push(["fee", "Pay the application fee (" + (p.inr ? inr(p.inr) : fee) + ") unless waived"]);
  out.push(["submit", isDate(dl.code) ? "Submit by " + fmtDate(dl.code) : dl.code === "Per position" ? "Find and apply to an advertised position" : dl.code === "Rolling" ? "Submit early (rolling review)" : "Find the deadline on the program page"]);
  const ns = FIELDS.filter(([k]) => f[k].code === "Not stated").map(([, n]) => lc(n.replace(/ \(.*\)$/, "")));

}
function planEvents(list) {
  const ev = [];
  for (const p of list) {
    const dl = p.f.deadline;
    if (isDate(dl.code)) ev.push({ date: dl.code, p, what: "Application deadline" + (dl.inferred ? " (year inferred)" : "") });
    for (const [k, n] of FIELDS) {
      const ts = p.f[k].time_sensitive;
      if (ts && !(k === "deadline" && ts === dl.code)) ev.push({ date: ts, p, what: "Act by: " + lc(n.replace(/ \(.*\)$/, "")) });
    }
  }
  return ev.sort((a, b) => a.date.localeCompare(b.date) || a.p.label.localeCompare(b.p.label));
}
function renderPlan() {
  const v = $("view-plan"); v.replaceChildren();

  }

  const payable = list.filter(p => p.inr), total = payable.reduce((s, p) => s + p.inr, 0);
  const waivable = payable.filter(p => ["Available", "Limited"].includes(p.f.fee_waiver.code));
  const unknownFee = list.filter(p => p.inr === null || p.inr === undefined).length;

  v.append(el("div", { class: "plan-grid" },
    el("div", { class: "panel stat" }, el("small", { text: "Programs" }), el("b", { text: list.length })),
    el("div", { class: "panel stat" }, el("small", { text: "Next deadline" }), el("b", { text: dated.length ? fmtDate(dated[0].f.deadline.code, { day: "numeric", month: "short" }) : "—" }), el("span", { text: dated.length ? dated[0].label + " · " + leftText(daysLeft(dated[0].f.deadline.code)) : "" })),
    el("div", { class: "panel stat" }, el("small", { text: "Application fees" }), el("b", { text: inr(total) }), el("span", { text: [waivable.length ? inr(waivable.reduce((s, p) => s + p.inr, 0)) + " waivable" : "", unknownFee ? unknownFee + " not stated" : ""].filter(Boolean).join(" · ") })),
    el("div", { class: "panel stat" }, el("small", { text: "Checklist" }), el("b", { text: doneN + " / " + allT.length }), el("div", { class: "progress" }, el("i", { style: "width:" + (allT.length ? Math.round(100 * doneN / allT.length) : 0) + "%" })))));
  v.append(el("div", { class: "plan-actions" },
    el("button", { type: "button", class: "primary", onclick: () => downloadIcs(list) }, "Add to calendar (.ics)"),
    el("button", { type: "button", onclick: () => downloadCsv(list) }, "Spreadsheet (.csv)"),
    el("button", { type: "button", onclick: () => window.print() }, "Print")));
  const tl = el("div", { class: "panel timeline" });

      el("span", {}, el("b", { text: e.p.label }), " · " + e.what), el("span", { class: "left" + (n >= 0 && n <= 14 ? " soon" : ""), text: leftText(n) })));

  v.append(el("div", { class: "d-sec", text: "Timeline" }), tl);

      ul.append(el("li", { class: done[key] ? "done" : "" }, el("label", {}, cb, el("span", { text: text }))));
    }
    box.append(ul, el("div", { class: "card-foot" }, el("button", { type: "button", class: "ghost", onclick: () => openDetail(p) }, "Details"),
      el("button", { type: "button", class: "ghost", onclick: () => { stars.delete(p.id); store.set("atlas2-stars", [...stars]); $("starCount").textContent = stars.size; renderPlan(); } }, "Remove")));
    v.append(box);
  }
}
function download(name, text, type) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
function icsEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFold(line) {
  const out = []; let cur = "";
  for (const ch of line) { if (new TextEncoder().encode(cur + ch).length > 73) { out.push(cur); cur = " " + ch; } else cur += ch; }
  out.push(cur); return out.join("\r\n");
}
function buildIcs(list) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//STEM PhD Atlas 2027//Plan//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:My PhD applications"];
  let n = 0;
  for (const e of planEvents(list)) {
    if (daysLeft(e.date) < 0) continue;
    const d = e.date.replace(/-/g, ""), next = new Date(new Date(e.date + "T12:00:00Z").getTime() + DAY).toISOString().slice(0, 10).replace(/-/g, "");
    lines.push("BEGIN:VEVENT", "UID:" + e.p.id + "-" + d + "-" + (n++) + "@stem-phd-atlas-2027", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + next,
      "SUMMARY:" + icsEsc(e.what + ": " + e.p.label), "DESCRIPTION:" + icsEsc("Confirm on the official page before you rely on this date: " + e.p.page), "URL:" + e.p.page,
      "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(e.what + " in 7 days: " + e.p.label), "TRIGGER:-P7D", "END:VALARM", "END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  return { text: lines.map(icsFold).join("\r\n") + "\r\n", events: n };
}
function downloadIcs(list) { download("my-phd-deadlines.ics", buildIcs(list).text, "text/calendar"); }
function downloadCsv(list) {
  const head = ["Program", "Field", "University", "Department", "Country"].concat(FIELDS.map(f => f[1])).concat(["Fee approx. INR", "Program page", "Checklist done"]);
  const esc = v => '"' + String(v === null || v === undefined ? "" : v).replace(/"/g, '""') + '"';
  const rows = list.map(p => [p.label, p.fname, p.u.n, p.dept, p.country].concat(FIELDS.map(([k]) => p.f[k].code + (p.f[k].code === p.f[k].value ? "" : " - " + p.f[k].value)))
    .concat([p.inr === null || p.inr === undefined ? "" : p.inr, p.page, tasks(p).filter(([k]) => done[p.id + ":" + k]).length + "/" + tasks(p).length]).map(esc).join(","));
  download("my-phd-plan.csv", "\ufeff" + [head.map(esc).join(",")].concat(rows).join("\r\n"), "text/csv");
}

/* ---------- guide ---------- */

  g.append(...sec("“Not stated”",

}

/* ---------- tabs, init ---------- */
