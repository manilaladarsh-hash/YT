<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<style>
:root {
  --bg: #f3f2ee; --panel: #ffffff; --panel-2: #f8f7f4; --sunk: #eeede8; --ink: #14181d; --ink-2: #2d343c; --muted: #616973; --faint: #8a919a;
  --line: #e1dfd9; --line-2: #ebeae5;
  --accent: #1e5a8e; --accent-2: #e5eef7; --accent-ink: #ffffff;
  --good: #17703d; --good-bg: #e2f3e7; --warn: #8a5800; --warn-bg: #fcefd3; --bad: #b02a2a; --bad-bg: #fbe3e1;
  --focus: #e8a317; --star: #c98500;
  --g-phys: #2a5fa8; --g-math: #6b3fa0; --g-comp: #0f7a73; --g-life: #2e7d32; --g-earth: #8a5a14; --g-eng: #b3471f;
  --shadow-1: 0 1px 2px rgba(17, 24, 32, .05), 0 1px 1px rgba(17, 24, 32, .03);
  --shadow-2: 0 10px 30px rgba(17, 24, 32, .12), 0 2px 8px rgba(17, 24, 32, .06);
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1317; --panel: #171d23; --panel-2: #1b2229; --sunk: #12171c; --ink: #e8ecf0; --ink-2: #cdd4db; --muted: #9aa4af; --faint: #76808b;
    --line: #29323b; --line-2: #222a32;
    --accent: #7fb9e8; --accent-2: #1a2a39; --accent-ink: #0b1117;
    --good: #8fd6a4; --good-bg: #16301f; --warn: #f0c46a; --warn-bg: #35280e; --bad: #f4a3a0; --bad-bg: #3a1d1d; --star: #f2c14e;
    --g-phys: #7fa9e8; --g-math: #b597e0; --g-comp: #5cc8bf; --g-life: #86c98a; --g-earth: #d8ac66; --g-eng: #ee9a77;
    --shadow-1: none; --shadow-2: 0 12px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1317; --panel: #171d23; --panel-2: #1b2229; --sunk: #12171c; --ink: #e8ecf0; --ink-2: #cdd4db; --muted: #9aa4af; --faint: #76808b;
  --line: #29323b; --line-2: #222a32;
  --accent: #7fb9e8; --accent-2: #1a2a39; --accent-ink: #0b1117;
  --good: #8fd6a4; --good-bg: #16301f; --warn: #f0c46a; --warn-bg: #35280e; --bad: #f4a3a0; --bad-bg: #3a1d1d; --star: #f2c14e;
  --g-phys: #7fa9e8; --g-math: #b597e0; --g-comp: #5cc8bf; --g-life: #86c98a; --g-earth: #d8ac66; --g-eng: #ee9a77;
  --shadow-1: none; --shadow-2: 0 12px 36px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-weight: 600; font-size: .9rem; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { color: var(--star); border-color: color-mix(in srgb, var(--star) 50%, var(--line)); background: color-mix(in srgb, var(--star) 10%, var(--panel)); }
.btn.on .ic { fill: currentColor; }
.btn .ic { width: 17px; height: 17px; }
.link-btn { border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: .88rem; }
.link-btn:hover { text-decoration: underline; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1840px; margin: 0 auto; padding: 10px clamp(16px, 2.5vw, 40px); display: flex; align-items: center; gap: 18px; }
.top-end { flex: 1 1 0; display: flex; justify-content: flex-end; }
.brand { flex: 1 1 0; display: flex; align-items: center; gap: 11px; min-width: 0; }
.mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.mark .ic { width: 20px; height: 20px; stroke-width: 1.7; }
.brand b { display: block; font-size: 1.02rem; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; }
.tabs button { position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; font-weight: 600; color: var(--muted); }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--accent-2); color: var(--accent); }
.tabs .ic { display: none; }
.count-pill { display: inline-block; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.count-pill.zero { background: var(--sunk); color: var(--muted); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink-2); flex: none; }
.icon-btn .ic { width: 18px; height: 18px; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; }
:root[data-theme="dark"] .theme .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme .sun { display: block; }
  :root:not([data-theme="light"]) .theme .moon { display: none; }
}

.wrap { max-width: 1840px; margin: 0 auto; padding: 22px clamp(16px, 2.5vw, 40px); }
.layout { display: grid; grid-template-columns: clamp(272px, 20vw, 320px) minmax(0, 1fr); gap: clamp(20px, 2vw, 32px); align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); }

/* situation */
.situation { position: sticky; top: 78px; max-height: calc(100vh - 98px); overflow: auto; overscroll-behavior: contain; }
.situation > summary { list-style: none; cursor: pointer; padding: 16px 18px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
.situation > summary::-webkit-details-marker { display: none; }
.situation > summary .ic { margin-left: auto; color: var(--faint); transition: transform .15s; }
.situation[open] > summary .ic { transform: rotate(180deg); }
.meter { display: inline-flex; align-items: center; gap: 8px; font-size: .76rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.mbar { width: 56px; height: 5px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.sit-body { padding: 0 18px 16px; }
.q { margin: 0; padding: 9px 0 10px; border: 0; border-top: 1px solid var(--line-2); min-width: 0; }
.q legend { float: left; width: 100%; padding: 0; margin: 0 0 6px; font-size: .82rem; font-weight: 650; color: var(--ink-2); }
.seg2 { clear: both; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.seg2 button { border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 7px 6px; font-size: .82rem; line-height: 1.25; color: var(--ink-2); font-weight: 550; }
.seg2 button:hover { border-color: var(--accent); color: var(--accent); }
.seg2 button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.scores label { display: flex; flex-direction: column; gap: 4px; font-size: .76rem; color: var(--muted); font-weight: 600; }
.scores input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); }
.sit-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line-2); }
.sit-foot .show-results { display: none; flex: 1; }
.sit-foot .link-btn { margin-left: auto; color: var(--muted); }

/* toolbar */
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 auto; min-width: 0; }
.search .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
.search input { width: 100%; height: 44px; padding: 0 14px 0 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-1); }
.search input::placeholder { color: var(--faint); }
.ctl { height: 44px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow-1); font-weight: 600; font-size: .9rem; white-space: nowrap; min-width: 0; }
.ctl > span { overflow: hidden; text-overflow: ellipsis; }
.ctl .ic { color: var(--faint); width: 16px; height: 16px; }
.ctl.on { border-color: var(--accent); background: var(--accent-2); color: var(--accent); }
.ctl.on .ic { color: var(--accent); }
.selwrap { position: relative; display: inline-flex; }
.selwrap select { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer; }
.selwrap .ic { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--faint); width: 16px; height: 16px; }
.toolbar > .pop, .toolbar > .selwrap { flex: 0 1 172px; min-width: 124px; }
.toolbar > .search { flex: 1 1 300px; min-width: 260px; }
.toolbar .ctl { width: 100%; justify-content: space-between; }
.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--sunk); border-radius: 12px; height: 44px; flex: none; }
.seg .ic { width: 18px; height: 18px; }
.seg button { display: grid; place-items: center; border: 0; border-radius: 9px; padding: 0 10px; background: transparent; color: var(--muted); font-weight: 600; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(17, 24, 32, .12); }

/* popovers */
.pop { position: relative; min-width: 0; }
.pop-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; width: 330px; max-height: min(70vh, 560px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-2); padding: 6px 6px 0; overscroll-behavior: contain; }
.pop-grp { display: flex; align-items: center; gap: 7px; padding: 10px 10px 4px; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pop-grp::before { content: ""; width: 8px; height: 8px; border-radius: 3px; background: var(--gc, var(--accent)); }
.chk { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: .9rem; }
.chk:hover { background: var(--panel-2); }
.chk input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); flex: none; }
.chk .n { margin-left: auto; color: var(--faint); font-size: .8rem; font-variant-numeric: tabular-nums; }
.pop-foot { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px -6px 0; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line-2); }
.scrim { display: none; }

/* quick filters, summary */
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 550; color: var(--ink-2); white-space: nowrap; }
.chip:hover { border-color: var(--faint); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 0 0 14px; font-size: .88rem; color: var(--muted); min-height: 24px; }
.summary b { color: var(--ink); font-size: 1rem; font-variant-numeric: tabular-nums; }
.summary .fc { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.summary .link-btn { margin-left: auto; font-size: .84rem; }
.fitbar { display: inline-flex; width: 110px; height: 6px; border-radius: 99px; overflow: hidden; background: var(--line-2); }
.fitbar i { display: block; height: 100%; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.good-c { background: var(--good); } .warn-c { background: var(--warn); } .bad-c { background: var(--bad); }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.card { cursor: pointer; display: flex; flex-direction: column; gap: 14px; padding: 18px 18px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-1); transition: box-shadow .15s, border-color .15s; }
.card:hover { border-color: color-mix(in srgb, var(--faint) 55%, var(--line)); box-shadow: var(--shadow-2); transform: translateY(-1px); }
.card { transition: box-shadow .15s, border-color .15s, transform .15s; }
.card.fit-match { box-shadow: inset 0 3px 0 var(--good), var(--shadow-1); }
.card.fit-check { box-shadow: inset 0 3px 0 var(--warn), var(--shadow-1); }
.card.fit-obstacle { box-shadow: inset 0 3px 0 var(--bad), var(--shadow-1); }
.c-head { display: flex; gap: 10px; align-items: flex-start; }
.c-head .grow { flex: 1; min-width: 0; }
.ftag { display: inline-flex; max-width: 100%; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px; background: color-mix(in srgb, var(--gc, var(--accent)) 12%, transparent); font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--gc, var(--accent)); white-space: nowrap; }
.ftag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.ftag .also { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card h3 { margin: 8px 0 2px; font-size: 1.2rem; line-height: 1.25; letter-spacing: -.01em; }
.c-title { border: 0; background: none; padding: 0; font-weight: 700; text-align: left; }
.c-title:hover { color: var(--accent); }
.meta { color: var(--muted); font-size: .83rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.star { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--faint); flex: none; }
.star .ic { width: 19px; height: 19px; }
.star:hover { color: var(--star); }
.star[aria-pressed="true"] { color: var(--star); border-color: color-mix(in srgb, var(--star) 45%, var(--line)); background: color-mix(in srgb, var(--star) 10%, var(--panel)); }
.star[aria-pressed="true"] .ic { fill: currentColor; }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-2); border-radius: 12px; background: var(--panel-2); }
.key { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 10px 12px 11px; border: 0; background: transparent; text-align: left; border-radius: 0; }
.key:first-child { border-radius: 11px 0 0 11px; } .key:last-child { border-radius: 0 11px 11px 0; }
.key + .key { border-left: 1px solid var(--line-2); }
.key:hover { background: var(--sunk); }
.key .ic { width: 15px; height: 15px; color: var(--faint); margin-bottom: 4px; }
.key b { font-size: .92rem; font-weight: 650; line-height: 1.25; overflow-wrap: normal; word-break: normal; }
.key span { font-size: .74rem; line-height: 1.3; color: var(--muted); }
.key.good b { color: var(--good); }
.key.na b { color: var(--muted); font-weight: 500; }
.key.soon span { color: var(--bad); font-weight: 650; }
.key.past b { color: var(--muted); text-decoration: line-through; }
.fit { border-radius: 11px; padding: 10px 12px; background: var(--panel-2); }
.fit.match { background: var(--good-bg); } .fit.check { background: var(--warn-bg); } .fit.obstacle { background: var(--bad-bg); }
.fit-h { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: .86rem; margin-bottom: 4px; }
.fit.match .fit-h { color: var(--good); } .fit.check .fit-h { color: var(--warn); } .fit.obstacle .fit-h { color: var(--bad); }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: .83rem; color: var(--ink-2); }
.reasons li { display: flex; gap: 7px; align-items: baseline; }
.reasons li::before { flex: none; width: 1em; text-align: center; font-weight: 800; font-size: .9em; }
.reasons li.bad::before { content: "✕"; color: var(--bad); }
.reasons li.warn::before { content: "!"; color: var(--warn); }
.reasons li.good::before { content: "✓"; color: var(--good); }
.reasons li.rest { color: var(--muted); }
.reasons li.rest::before { content: "+"; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); }
.tag.good { background: var(--good-bg); color: var(--good); } .tag.warn { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
.ns { font-size: .76rem; color: var(--faint); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line-2); }
.ext { display: inline-flex; align-items: center; gap: 5px; font-size: .85rem; font-weight: 600; text-decoration: none; }
.ext:hover { text-decoration: underline; }
.ext .ic { width: 14px; height: 14px; }
.more { display: flex; justify-content: center; margin: 20px 0 8px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty .ic { width: 34px; height: 34px; color: var(--faint); }
.empty p { margin: 0; }

/* table */
.tablewrap { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; min-width: 1200px; font-size: .85rem; }
table.grid th, table.grid td { text-align: left; vertical-align: middle; padding: 8px; border-bottom: 1px solid var(--line-2); }
table.grid th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
table.grid tr:hover td { background: var(--panel-2); }
table.grid td.prog { min-width: 220px; }
table.grid td.prog b { display: block; }
table.grid td.prog span { color: var(--muted); font-size: .78rem; }
table.grid .star { width: 32px; height: 32px; }
.cellbtn { border: 0; background: var(--sunk); color: var(--ink-2); padding: 2px 7px; border-radius: 6px; text-align: left; font-size: .8rem; font-weight: 550; white-space: nowrap; }
.cellbtn.good { background: var(--good-bg); color: var(--good); } .cellbtn.warn { background: var(--warn-bg); color: var(--warn); } .cellbtn.bad { background: var(--bad-bg); color: var(--bad); }
.cellbtn.na { background: transparent; color: var(--faint); }
.fitpill { font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.fitpill.match { background: var(--good-bg); color: var(--good); } .fitpill.check { background: var(--warn-bg); color: var(--warn); } .fitpill.obstacle { background: var(--bad-bg); color: var(--bad); }

/* detail */
dialog { width: min(880px, calc(100% - 32px)); max-height: calc(100dvh - 40px); padding: 0; border: 0; border-radius: 18px; background: var(--panel); color: var(--ink); box-shadow: var(--shadow-2); overscroll-behavior: contain; }
dialog::backdrop { background: rgba(10, 14, 18, .55); }
.d-head { position: sticky; top: 0; z-index: 2; padding: 20px 24px 16px; background: var(--panel); border-bottom: 1px solid var(--line-2); }
.d-head h2 { margin: 6px 0 4px; padding-right: 44px; font-size: 1.4rem; line-height: 1.25; letter-spacing: -.015em; }
.d-head .meta { -webkit-line-clamp: 3; }
.d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.d-close { position: absolute; top: 14px; right: 14px; }
.d-body { padding: 6px 24px 24px; }
.d-body > .fit { margin-top: 16px; }

.quote { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--line); border-radius: 0 9px 9px 0; background: var(--panel-2); font-size: .84rem; line-height: 1.5; color: var(--muted); }

.d-foot { margin-top: 18px; font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }

/* plan */

.stat small { display: block; font-size: .76rem; font-weight: 650; color: var(--muted); }

.progress { height: 6px; margin-top: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 99px; background: var(--good); }
.plan-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.plan-cols { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (min-width: 1500px) { .checks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; } .checks .todo { margin: 0; } }
.col-h { margin: 0 0 10px; font-size: .74rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.timeline { padding: 4px 18px 12px; position: sticky; top: 78px; }
.tl-month { margin: 14px 0 4px; font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.tl-item { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; padding: 7px 0; }
.tl-item + .tl-item { border-top: 1px solid var(--line-2); }
.tl-date { padding: 4px 0 5px; border-radius: 10px; background: var(--sunk); text-align: center; line-height: 1.1; }
.tl-date b { display: block; font-size: 1.08rem; font-variant-numeric: tabular-nums; }
.tl-date small { font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tl-date.soon { background: var(--bad-bg); color: var(--bad); }
.tl-date.soon small { color: var(--bad); }
.tl-date.nodate { padding: 8px 0; font-size: .64rem; font-weight: 700; color: var(--muted); }
.tl-text { min-width: 0; font-size: .86rem; }
.tl-text b { display: block; font-size: .9rem; }
.tl-text span { color: var(--muted); }
.tl-text .left.soon { color: var(--bad); font-weight: 650; }
.tl-item.past { opacity: .55; }
.todo { padding: 16px 18px 10px; margin-bottom: 12px; }
.todo-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.todo h3 { margin: 0; font-size: 1rem; line-height: 1.3; }
.todo .when { flex: none; font-size: .8rem; font-weight: 600; color: var(--muted); }

.todo input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--good); flex: none; }

.todo-foot { display: flex; justify-content: space-between; padding-top: 6px; border-top: 1px solid var(--line-2); }

footer { max-width: 1840px; margin: 0 auto; padding: 8px clamp(16px, 2.5vw, 40px) 36px; color: var(--faint); font-size: .78rem; }

/* ---------- filtering + sorting ---------- */
const collator = new Intl.Collator();
function visible() {
  const q = $("q").value.trim().toLowerCase();
  const plus42 = new Date(Date.now() + 42 * DAY).toISOString().slice(0, 10);
  const out = [];
  for (const p of P) {
    if (profile.fields.length && !p.fieldsAll.some(x => profile.fields.includes(x))) continue;
    if (profile.regions.length && !profile.regions.includes(p.region)) continue;
    if (q && !q.split(/\s+/).every(w => p.hay.includes(w))) continue;
    if (quick.has("starred") && !stars.has(p.id)) continue;
    if (quick.has("nofee") && !(feeIsZero(p) || ["Available", "Limited", "No fee"].includes(p.f.fee_waiver.code))) continue;
    if (quick.has("funded") && p.f.funding.code !== "Guaranteed") continue;
    const dl = p.f.deadline.code;
    if (quick.has("soon") && !(isDate(dl) && dl >= todayIso() && dl <= plus42)) continue;
    const ft = fit(p);
    if (quick.has("hideobs") && ft.status === "obstacle") continue;
    out.push([p, ft]);
  }
  const s = $("sort").value;
  const rank = { match: 0, check: 1, none: 1, obstacle: 2 };
  const dkey = p => { const d = p.f.deadline.code; return isDate(d) ? (d < todayIso() ? "8" + d : d) : "9" + d; };
  const fee = p => p.inr === null || p.inr === undefined ? Infinity : p.inr;
  out.sort(([a, fa], [b, fb]) => {
    if (s === "fit") return rank[fa.status] - rank[fb.status] || fa.warn - fb.warn || collator.compare(dkey(a), dkey(b)) || collator.compare(a.label, b.label);
    if (s === "deadline") return collator.compare(dkey(a), dkey(b)) || collator.compare(a.label, b.label);
    if (s === "fee") return fee(a) - fee(b) || collator.compare(a.label, b.label);

  $("moreBtn").addEventListener("click", () => { shown += PAGE; render(true); });
  for (const b of document.querySelectorAll("[data-quick]")) b.addEventListener("click", () => { const k = b.dataset.quick; quick.has(k) ? quick.delete(k) : quick.add(k); render(); });
  for (const id of ["pop-field", "pop-region"]) {
    $(id).querySelector(".ctl").addEventListener("click", () => $(id).classList.contains("open") ? closePops() : openPop(id));
    $(id).querySelector(".scrim").addEventListener("click", closePops);
  }
  document.addEventListener("click", e => { if (!e.target.closest(".pop")) closePops(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closePops();
    if (e.key === "/" && !e.target.closest("input, select, textarea") && !$("view-find").hidden) { e.preventDefault(); $("q").focus(); }
  });
  const setView = v => { view = v; store.set("atlas2-view", v); $("vCards").setAttribute("aria-pressed", v === "cards"); $("vTable").setAttribute("aria-pressed", v === "table"); render(true); };
  $("vCards").addEventListener("click", () => setView("cards")); $("vTable").addEventListener("click", () => setView("table"));
  $("vCards").setAttribute("aria-pressed", view === "cards"); $("vTable").setAttribute("aria-pressed", view === "table");
  for (const n of ["find", "plan", "guide"]) $("tab-" + n).addEventListener("click", () => showTab(n));
  $("dClose").addEventListener("click", () => $("detail").close());
  $("detail").addEventListener("click", e => { if (e.target === $("detail")) $("detail").close(); });
  $("detail").addEventListener("close", () => { if (!$("view-plan").hidden) renderPlan(); else render(true); });
  $("theme").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; store.set("atlas2-theme", root.dataset.theme);
  });
  if (matchMedia("(max-width: 920px)").matches) $("situation").open = false;
  $("loading").remove();
  showTab(store.get("atlas2-tab", "find"));
  window.ATLAS_READY = true;
}
window.atlasTest = { fit: p => fit(p), buildIcs, tasks, get programs() { return P; }, setProfile(p) { profile = Object.assign(profile, p); saveProfile(); buildSituation(); } };
init();
</script>
</body>
</html>
